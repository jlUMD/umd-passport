<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>UMD Passport</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>UMD Passport</h1>
  </header>

  <main>
    <section id="links">
      <h2>Where to go</h2>
      <ul>
        <li><a href="#">Club Sign-Up Sheet</a></li>
        <li><a href="#">Study Spot Map</a></li>
        <li><a href="#">Instructions / About</a></li>
      </ul>
    </section>

    <section id="badges">
      <h2>Available Badges</h2>
      <button class="badge-btn" data-badge="Testudo's Nose">Touch Testudo's Nose</button>
    </section>

    <section id="passport">
      <div class="passport-cover">
        <p class="passport-top">Student Passport</p>
        <h2>UMD Passport</h2>
      </div>
      <div class="passport-page">
        <p class="holder">Holder: <span>_______________</span></p>
        <ul id="passport-list"></ul>
      </div>
    </section>
  </main>

  <div id="badge-popup" class="popup hidden">
    <div class="popup-card">
      <img src="testudo_nose_badge.webp" alt="" width="140">
      <h3>Badge Earned!</h3>
      <p id="popup-name"></p>
      <button id="popup-close">Add to Passport</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
